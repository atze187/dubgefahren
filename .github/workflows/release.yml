name: Build and release

on:
  push:
    branches:
      - feature/macos-build # TEMPORARY: remove before merging
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 all -Config Release

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-extract -Force
          New-Item -ItemType Directory -Force tools\bin | Out-Null
          $exe = Get-ChildItem -Path pluginval-extract -Recurse -Filter pluginval.exe | Select-Object -First 1
          Copy-Item $exe.FullName tools\bin\pluginval.exe

      - name: Validate (Steinberg validator + pluginval)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 validate -Config Release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $name = "Dubgefahren-$version-win64"
          $staging = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item -Recurse "build\plugin\Dubgefahren_artefacts\Release\VST3\Dubgefahren.vst3" $staging
          Copy-Item README.md, LICENSE $staging
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUNDLE: build-macos/plugin/Dubgefahren_artefacts/Release/VST3/Dubgefahren.vst3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        run: command -v ninja >/dev/null || brew install ninja

      - name: Configure
        run: cmake --preset macos-universal

      - name: Build
        run: cmake --build --preset macos-release --parallel

      - name: Test
        run: ctest --preset macos-release

      - name: Check architectures
        run: |
          archs=$(lipo -archs "$BUNDLE/Contents/MacOS/Dubgefahren")
          echo "archs: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

      - name: Validate (Steinberg validator)
        run: |
          (cd tools/vst3validator && cmake --preset validator-macos && cmake --build --preset validator-macos --parallel)
          validator=$(find build-macos/vst3validator -type f -name validator | head -n 1)
          test -n "$validator"
          "$validator" "$BUNDLE"

      - name: Validate (pluginval)
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval-extract
          pluginval-extract/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --validate "$BUNDLE"

      - name: Sign (ad-hoc) and package
        id: package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version="dev-${GITHUB_SHA::7}"; fi
          name="Dubgefahren-$version-macos"
          staging="$RUNNER_TEMP/$name"
          mkdir -p "$staging"
          codesign --force --deep -s - "$BUNDLE"
          ditto "$BUNDLE" "$staging/Dubgefahren.vst3"
          cp README.md LICENSE "$staging"
          zip="$RUNNER_TEMP/$name.zip"
          ditto -c -k "$staging" "$zip"
          check="$RUNNER_TEMP/check"
          mkdir -p "$check"
          ditto -x -k "$zip" "$check"
          codesign --verify --deep --strict --verbose=2 "$check/Dubgefahren.vst3"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}

  publish:
    needs: [windows, macos]
    # Runs even if the macOS job failed: the Windows release must not depend on it.
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Dubgefahren-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -l dist

      - name: Write release notes
        run: |
          : > notes.md
          if ls dist/*-macos.zip >/dev/null 2>&1; then
            cat > notes.md <<'EOF'
          **macOS (experimental):** the macOS build is untested on real hardware and not notarized.
          After copying `Dubgefahren.vst3` to `~/Library/Audio/Plug-Ins/VST3`, remove the quarantine with
          `xattr -cr ~/Library/Audio/Plug-Ins/VST3/Dubgefahren.vst3` and rescan plugins in your DAW.

          EOF
          fi

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          body_path: notes.md
          generate_release_notes: true
